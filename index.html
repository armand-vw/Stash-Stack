<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Stash-Stack — a private, offline-first personal budgeting and financial management dashboard." />
<meta name="theme-color" content="#020617" />
<title>Stash-Stack · Personal Finance Dashboard</title>

<!-- Prevent theme flash before Tailwind paints -->
<script>
  try {
    var __s = JSON.parse(localStorage.getItem('stashstack.v1') || '{}');
    if (__s && __s.settings && __s.settings.theme === 'light') {
      document.documentElement.classList.remove('dark');
    }
  } catch (e) {}
</script>

<!-- Tailwind CSS (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
        },
        colors: {
          brand: {
            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
            800: '#3730a3', 900: '#312e81',
          },
        },
        keyframes: {
          'fade-in': { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          'slide-up': { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },

<script>

  'use strict';

  /* ------------------------------------------------------------------ *

  const GROUPS = {

  /* Country tax presets — all values editable in-app.
     Bands are annual, progressive. `upTo: null` = no upper bound.
     Contributions support rate %, optional annual threshold & cap (with period). */
  const TAX_PRESETS = {
    ZA: {
      country: 'ZA', label: 'South Africa · PAYE 2024/25', defaultGross: 55000,
      allowance: 0, rebate: 17235, surcharge: 0,
      bands: [
        { upTo: 237100,  rate: 18 },
        { upTo: 370500,  rate: 26 },
        { upTo: 512800,  rate: 31 },
        { upTo: 673000,  rate: 36 },
        { upTo: 857900,  rate: 39 },
        { upTo: 1817000, rate: 41 },
        { upTo: null,    rate: 45 },
      ],
      contributions: [
        { name: 'UIF', rate: 1, threshold: 0, thresholdPeriod: 'year', cap: 17712, capPeriod: 'month', deductible: false },
      ],
    },
    US: {
      country: 'US', label: 'United States · Federal 2024 (single)', defaultGross: 6500,
      allowance: 14600, rebate: 0, surcharge: 0,
      bands: [
        { upTo: 11600,  rate: 10 },
        { upTo: 47150,  rate: 12 },
        { upTo: 100525, rate: 22 },
        { upTo: 191950, rate: 24 },
        { upTo: 243725, rate: 32 },
        { upTo: 609350, rate: 35 },
        { upTo: null,   rate: 37 },
      ],
      contributions: [
        { name: 'Social Security', rate: 6.2,  threshold: 0, thresholdPeriod: 'year', cap: 168600, capPeriod: 'year', deductible: false },
        { name: 'Medicare',        rate: 1.45, threshold: 0, thresholdPeriod: 'year', cap: null,   capPeriod: 'year', deductible: false },
      ],
    },
    UK: {
      country: 'UK', label: 'United Kingdom · Income Tax 2024/25', defaultGross: 4000,
      allowance: 12570, rebate: 0, surcharge: 0,
      bands: [
        { upTo: 37700,  rate: 20 },
        { upTo: 125140, rate: 40 },
        { upTo: null,   rate: 45 },
      ],
      contributions: [
        { name: 'National Insurance', rate: 8, threshold: 12570, thresholdPeriod: 'year', cap: 50270, capPeriod: 'year', deductible: false },
        { name: 'NI (upper)',         rate: 2, threshold: 50270, thresholdPeriod: 'year', cap: null,  capPeriod: 'year', deductible: false },
      ],
    },
    BE: {
      country: 'BE', label: 'Belgium · Income Tax 2024', defaultGross: 4000,
      allowance: 10160, rebate: 0, surcharge: 7,
      bands: [
        { upTo: 15200, rate: 25 },
        { upTo: 26830, rate: 40 },
        { upTo: 46440, rate: 45 },
        { upTo: null,  rate: 50 },
      ],
      contributions: [
        { name: 'Social security (RSZ)', rate: 13.07, threshold: 0, thresholdPeriod: 'year', cap: null, capPeriod: 'year', deductible: true },
      ],
    },
  };

  const CURRENCY_PROFILES = {
    ZAR: { code: 'ZAR', locale: 'en-ZA', symbol: 'R',  country: 'ZA', name: 'R' },
    USD: { code: 'USD', locale: 'en-US', symbol: '$',  country: 'US', name: 'USD' },
    GBP: { code: 'GBP', locale: 'en-GB', symbol: '£',  country: 'UK', name: 'GBP' },
    EUR: { code: 'EUR', locale: 'nl-BE', symbol: '€',  country: 'BE', name: 'EUR' },
  };

  const ICON_PATHS = {
    dashboard: '<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>',
    budget:    '<path d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/>',
    transactions: '<path d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/>',
    goals:     '<path d="M3 3v18m0-18h13l-2 4 2 4H3"/>',
    salary:    '<path d="M9 7h6m-6 4h6m-6 3h3m-6 6h12a2 2 0 002-2V5a2 2 0 00-2-2H6a2 2 0 00-2 2v14a2 2 0 002 2z"/>',
    plus:      '<path d="M12 4v16m8-8H4"/>',
    search:    '<path d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/>',
    trash:     '<path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"/>',
    edit:      '<path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>',
    arrowUp:   '<path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>',
    arrowDown: '<path d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/>',
    wallet:    '<path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>',
    target:    '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  };

  const NAV = [
    { id: 'dashboard',    label: 'Dashboard',    icon: 'dashboard' },
    { id: 'budget',       label: 'Budgeting',    icon: 'budget' },
    { id: 'transactions', label: 'Transactions', icon: 'transactions' },
    { id: 'goals',        label: 'Goals',        icon: 'goals' },
    { id: 'salary',       label: 'Salary',       icon: 'salary' },
  ];

  /* ------------------------------------------------------------------ *
   * 2. STATE
   * ------------------------------------------------------------------ */
  let state = null;
  const ui = {
    txPage: 1,
    dashboardMonth: null,
    charts: { expense: null, trend: null },
  };

  function defaultSalary(key) {
    const p = TAX_PRESETS[key] || TAX_PRESETS.ZA;
    return {
      presetKey: key,
      gross: p.defaultGross || 0,
      period: 'monthly',
      allowance: p.allowance,
      rebate: p.rebate,
      surcharge: p.surcharge,
      bands: p.bands.map((b) => ({ ...b })),
      contributions: p.contributions.map((c) => ({ ...c })),
      deductions: [],
    };
  }

  function freshState() {
    return {
      version: 1,
      settings: { theme: 'dark', currency: 'ZAR', locale: 'en-ZA', salary: defaultSalary('ZA') },
      categories: DEFAULT_CATEGORIES.map((c) => ({ id: uid(), ...c })),
      transactions: [],
      goals: [],
      budgetRule: { mode: '50/30/20', needs: 50, wants: 30, savings: 20, baselineIncome: 0 },
    };
  }

  function mergeState(p) {
    const base = freshState();
    const s = Object.assign({}, base, p);
    s.settings = Object.assign({}, base.settings, p.settings || {});
    s.budgetRule = Object.assign({}, base.budgetRule, p.budgetRule || {});
    const sk = (s.settings.salary && s.settings.salary.presetKey) || 'ZA';
    s.settings.salary = Object.assign(defaultSalary(TAX_PRESETS[sk] ? sk : 'ZA'), s.settings.salary || {});
    if (!Array.isArray(s.categories) || !s.categories.length) s.categories = base.categories;
    if (!Array.isArray(s.transactions)) s.transactions = [];
    if (!Array.isArray(s.goals)) s.goals = [];
    if (!CURRENCY_PROFILES[s.settings.currency]) s.settings.currency = 'ZAR';
    return s;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return mergeState(JSON.parse(raw));
    } catch (e) { console.warn('State load failed, starting fresh.', e); }
    return freshState();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error(e);
      toast('Could not save to localStorage (storage full?)', 'error');
    }
  }

  /* ------------------------------------------------------------------ *
   * 3. UTILS
   * ------------------------------------------------------------------ */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function num(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
  function clamp(n, min, max) { return Math.min(Math.max(n, min), max); }
  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayISO() { return isoDate(new Date()); }
  function ym(dateStr) { return (dateStr || '').slice(0, 7); }
  function currentYM() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function addMonths(date, n) {
    const d = new Date(date);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d;
  }
  function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
  function monthLabel(key) {
    const [y, m] = key.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(locale(), { month: 'long', year: 'numeric' });
  }
  function shortMonthLabel(key) {
    const [y, m] = key.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(locale(), { month: 'short' });
  }
  function fmtDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString(locale(), { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function locale() { return (state && state.settings.locale) || 'en-ZA'; }
  function currencyProfile() { return CURRENCY_PROFILES[state.settings.currency] || CURRENCY_PROFILES.ZAR; }
  function money(n, decimals) {
    const p = currencyProfile();
    try {
      return new Intl.NumberFormat(p.locale, {
        style: 'currency', currency: p.code,
        minimumFractionDigits: decimals == null ? 2 : decimals,
        maximumFractionDigits: decimals == null ? 2 : decimals,
      }).format(Number.isFinite(n) ? n : 0);
    } catch (e) {
      return p.symbol + ' ' + round2(num(n)).toLocaleString();
    }
  }
  function compactMoney(n) {
    const p = currencyProfile();
    try {
      return new Intl.NumberFormat(p.locale, { style: 'currency', currency: p.code, notation: 'compact', maximumFractionDigits: 1 }).format(n);
    } catch (e) { return money(n, 0); }
  }
  function pct(n, decimals) { return (Number.isFinite(n) ? n : 0).toFixed(decimals == null ? 1 : decimals) + '%'; }
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function icon(name, cls) {
    return '<svg class="' + (cls || 'w-5 h-5') + '" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' + (ICON_PATHS[name] || '') + '</svg>';
  }
  function sum(arr, fn) { return arr.reduce((a, x) => a + (fn ? fn(x) : x), 0); }
  function monthTx(key) { return state.transactions.filter((t) => ym(t.date) === key); }
  function sumMonth(key, type) {
    return sum(monthTx(key).filter((t) => t.type === type), (t) => num(t.amount));
  }
  function catOf(id) { return state.categories.find((c) => c.id === id) || null; }
  function catName(id) { const c = catOf(id); return c ? c.name : 'Uncategorised'; }
  function catColor(id) { const c = catOf(id); return c ? c.color : '#64748b'; }
  function last6Months() {
    const out = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1));
    }
    return out;
  }

   * 4. UI PRIMITIVES (toast, modal)

  function toast(message, type) {
    const colors = {
      success: 'border-emerald-500/40 bg-emerald-50 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-200',
      error:   'border-rose-500/40 bg-rose-50 text-rose-800 dark:bg-rose-950/60 dark:text-rose-200',
      info:    'border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200',
    };
    const el = document.createElement('div');
    el.className = 'animate-toast-in max-w-xs rounded-xl border px-4 py-3 text-sm font-medium shadow-lg ' + (colors[type] || colors.info);
    el.textContent = message;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateX(12px)';
      setTimeout(() => el.remove(), 300);
    }, 3200);
  }

  let modalCleanup = null;
  function openModal(opts) {
    const root = document.getElementById('modal-root');
    const footer = opts.footer !== undefined
      ? '<div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-200 dark:border-slate-800">' + opts.footer + '</div>'
      : '';
    root.innerHTML =
      '<div class="modal-backdrop" data-modal-backdrop>' +
        '<div class="modal-panel" role="dialog" aria-modal="true">' +
          '<div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900 z-10">' +
            '<h3 class="text-base font-bold">' + esc(opts.title || '') + '</h3>' +
            '<button type="button" class="btn-icon" data-modal-close aria-label="Close">' +
              '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button>' +
          '</div>' +
          '<form id="modal-form" novalidate>' +
            '<div class="px-6 py-5">' + (opts.body || '') + '</div>' +
            (opts.footer === undefined
              ? '<div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-200 dark:border-slate-800 sticky bottom-0 bg-white dark:bg-slate-900">' +
                  '<button type="button" class="btn-soft" data-modal-close>Cancel</button>' +
                  '<button type="submit" class="btn-primary">' + esc(opts.submitLabel || 'Save') + '</button>' +
                '</div>'
              : '') +
          '</form>' +
          (opts.footer !== undefined ? footer : '') +
        '</div>' +
      '</div>';

    const form = document.getElementById('modal-form');
    function close() {
      root.innerHTML = '';
      document.removeEventListener('keydown', onKey);
      if (modalCleanup) { modalCleanup(); modalCleanup = null; }
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    root.querySelectorAll('[data-modal-close]').forEach((b) => b.addEventListener('click', close));
    const backdrop = root.querySelector('[data-modal-backdrop]');
    backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) close(); });
    if (form && opts.onSubmit) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form).entries());
        const result = opts.onSubmit(data, form);
        if (result !== false) close();
      });
    }
    modalCleanup = close;
    const first = root.querySelector('input:not([type=hidden]), select, textarea');
    if (first) setTimeout(() => first.focus(), 50);
    return { close };
  }

  function confirmModal(message, onConfirm, opts) {

    openModal({

      submitLabel: opts.submitLabel || 'Confirm',

  /* ------------------------------------------------------------------ *
   * 5. DOMAIN — recurring materialisation + CRUD
   * ------------------------------------------------------------------ */
  function materializeRecurring() {
    const now = new Date();
    now.setHours(23, 59, 59, 999);
    let changed = false;
    const originals = state.transactions.filter((t) => t.recurring && t.recurring !== 'none' && !t.parentId);
    originals.forEach((tx) => {
      const existing = new Set(state.transactions.filter((t) => t.parentId === tx.id).map((t) => t.date));
      let cursor = new Date(tx.date + 'T00:00:00');
      let guard = 0;
      while (guard++ < 500) {
        cursor = tx.recurring === 'monthly' ? addMonths(cursor, 1) : addDays(cursor, 7);
        if (cursor > now) break;
        const iso = isoDate(cursor);
        if (existing.has(iso)) continue;
        state.transactions.push({
          id: uid(), date: iso, categoryId: tx.categoryId, type: tx.type,
          amount: num(tx.amount), description: tx.description, recurring: 'none',
          parentId: tx.id, auto: true,
        });
        existing.add(iso);
        changed = true;
      }
    });
    if (changed) save();
  }

  function addTransaction(data) {
    state.transactions.push({
      id: uid(),
      date: data.date || todayISO(),
      categoryId: data.categoryId,
      type: data.type,
      amount: round2(num(data.amount)),
      description: (data.description || '').trim(),
      recurring: data.recurring || 'none',
    });
    save();
  }
  function updateTransaction(id, data) {
    const t = state.transactions.find((x) => x.id === id);
    if (!t) return;
    Object.assign(t, {
      date: data.date, categoryId: data.categoryId, type: data.type,
      amount: round2(num(data.amount)), description: (data.description || '').trim(),
      recurring: data.recurring || 'none',
    });
    save();
  }
  function deleteTransaction(id) {
    state.transactions = state.transactions.filter((t) => t.id !== id);
    save();
  }

  /* ------------------------------------------------------------------ *
   * 6. SALARY ENGINE
   * ------------------------------------------------------------------ */
  function toAnnual(v, period) { return period === 'month' ? num(v) * 12 : num(v); }

  function computeSalary() {
    const s = state.settings.salary;
    const div = s.period === 'monthly' ? 12 : 1;
    const annualGross = s.period === 'monthly' ? num(s.gross) * 12 : num(s.gross);

    const contributions = (s.contributions || []).map((c) => {
      const cap = (c.cap === null || c.cap === '' || c.cap === undefined) ? Infinity : toAnnual(c.cap, c.capPeriod);
      const thr = (c.threshold === null || c.threshold === '' || c.threshold === undefined) ? 0 : toAnnual(c.threshold, c.thresholdPeriod);
      const base = Math.max(0, Math.min(annualGross, cap) - thr);
      const amount = base * num(c.rate) / 100;
      return { name: c.name, rate: num(c.rate), deductible: !!c.deductible, amount };
    });

    const deductions = (s.deductions || []).map((d) => {
      let amount;
      if (d.type === 'percent') amount = annualGross * num(d.amount) / 100;
      else amount = d.period === 'month' ? num(d.amount) * 12 : num(d.amount);
      return { name: d.name, type: d.type, pretax: !!d.pretax, amount };
    });

    const deductibleContrib = sum(contributions.filter((c) => c.deductible), (c) => c.amount);
    const pretaxDed = sum(deductions.filter((d) => d.pretax), (d) => d.amount);
    const taxable = Math.max(0, annualGross - num(s.allowance) - deductibleContrib - pretaxDed);

    let tax = 0, prev = 0, marginal = 0;
    (s.bands || []).forEach((b) => {
      const up = (b.upTo === null || b.upTo === '' || b.upTo === undefined) ? Infinity : num(b.upTo);
      if (taxable > prev) {
        const slice = Math.min(taxable, up) - prev;
        tax += slice * num(b.rate) / 100;
        marginal = num(b.rate);
      }
      prev = up;
    });

    tax = Math.max(0, tax - num(s.rebate));
    const surcharge = tax * num(s.surcharge) / 100;
    const totalTax = tax + surcharge;
    const totalContrib = sum(contributions, (c) => c.amount);
    const totalDeductions = sum(deductions, (d) => d.amount);
    const net = annualGross - totalTax - totalContrib - totalDeductions;

    return {
      period: s.period,
      gross: annualGross / div,
      annualGross,
      allowance: num(s.allowance) / div,
      taxable: taxable / div,
      tax: tax / div,
      surcharge: surcharge / div,
      totalTax: totalTax / div,
      contributions: contributions.map((c) => ({ name: c.name, rate: c.rate, amount: c.amount / div })),
      totalContrib: totalContrib / div,
      deductions: deductions.map((d) => ({ name: d.name, amount: d.amount / div })),
      totalDeductions: totalDeductions / div,
      net: net / div,
      effectiveRate: annualGross ? (totalTax / annualGross) * 100 : 0,
      marginalRate: marginal,
    };
  }

  function applyPreset(key) {
    const p = TAX_PRESETS[key];
    if (!p) return;
    const s = state.settings.salary;
    s.presetKey = key;
    s.allowance = p.allowance;
    s.rebate = p.rebate;
    s.surcharge = p.surcharge;
    s.bands = p.bands.map((b) => ({ ...b }));
    s.contributions = p.contributions.map((c) => ({ ...c }));
  }

  /* ------------------------------------------------------------------ *
   * 7. ROUTER / THEME / CURRENCY / SIDEBAR
   * ------------------------------------------------------------------ */
  function activeTab() {
    const h = (location.hash || '#dashboard').replace('#', '');
    return NAV.some((n) => n.id === h) ? h : 'dashboard';
  }

  function route() {
    const tab = activeTab();
    if (!ui.dashboardMonth) ui.dashboardMonth = currentYM();
    document.querySelectorAll('.nav-link').forEach((a) => {
      a.classList.toggle('active', a.dataset.tab === tab);
    });
    closeSidebar();
    render();
  }

  function go(tab) { location.hash = '#' + tab; }

  function render() {
    const tab = activeTab();
    const view = document.getElementById('view');
    destroyCharts();
    if (tab === 'dashboard') view.innerHTML = viewDashboard();
    else if (tab === 'budget') view.innerHTML = viewBudget();
    else if (tab === 'transactions') view.innerHTML = viewTransactions();
    else if (tab === 'goals') view.innerHTML = viewGoals();
    else if (tab === 'salary') view.innerHTML = viewSalary();
    if (tab === 'dashboard') requestAnimationFrame(renderCharts);
    window.scrollTo({ top: 0 });
  }

  function renderSidebar() {
    const nav = document.getElementById('nav');
    nav.innerHTML = NAV.map((n) =>
      '<a href="#' + n.id + '" class="nav-link" data-tab="' + n.id + '">' + icon(n.icon) + '<span>' + n.label + '</span></a>'
    ).join('');
    const sel = document.getElementById('currency-select');
    sel.innerHTML = Object.keys(CURRENCY_PROFILES).map((code) => {
      const p = CURRENCY_PROFILES[code];
      return '<option value="' + code + '"' + (state.settings.currency === code ? ' selected' : '') + '>' + p.symbol + ' ' + code + '</option>';
    }).join('');
    updateThemeButtons();
  }

  function updateThemeButtons() {
    const dark = state.settings.theme === 'dark';
    const label = dark ? '☀️ Light' : '🌙 Dark';
    const a = document.getElementById('theme-toggle');
    const b = document.getElementById('theme-toggle-mobile');
    if (a) a.innerHTML = label;
    if (b) b.innerHTML = dark
      ? '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>'
      : '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
  }

  function toggleTheme() {
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.classList.toggle('dark', state.settings.theme === 'dark');
    save();
    updateThemeButtons();
    if (activeTab() === 'dashboard') { destroyCharts(); requestAnimationFrame(renderCharts); }
  }

  function updateChartTheme() {
    if (!window.Chart) return;
    const dark = state.settings.theme === 'dark';
    Chart.defaults.color = dark ? '#94a3b8' : '#64748b';
    Chart.defaults.borderColor = dark ? 'rgba(148,163,184,.12)' : 'rgba(100,116,139,.15)';
  }

  function applyCurrency(code) {
    const p = CURRENCY_PROFILES[code];
    if (!p) return;
    state.settings.currency = code;
    state.settings.locale = p.locale;
    if (TAX_PRESETS[p.country]) applyPreset(p.country);
    save();
  }

    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.remove('hidden');

  function kpiCard(label, value, sub, tone, iconName) {

      brand: 'text-brand-500 bg-brand-500/10',
      emerald: 'text-emerald-500 bg-emerald-500/10',
      rose: 'text-rose-500 bg-rose-500/10',
      sky: 'text-sky-500 bg-sky-500/10',

      '<div class="flex items-start justify-between gap-3">' +
        '<div class="min-w-0">' +
          '<p class="text-xs font-semibold uppercase tracking-wide text-slate-400">' + esc(label) + '</p>' +
          '<p class="mt-2 text-2xl font-extrabold tracking-tight truncate">' + value + '</p>' +

        '<div class="grid place-items-center w-10 h-10 rounded-xl shrink-0 ' + t + '">' + icon(iconName, 'w-5 h-5') + '</div>' +
      '</div>' +

  }

  function viewDashboard() {

    const income = sumMonth(key, 'income');
    const expenses = sumMonth(key, 'expense');

      if (t.type !== 'expense') return false;
      const c = catOf(t.categoryId);
      return c && c.group === 'savings';
    }), (t) => num(t.amount));
    const savingsRate = income ? (savingsSpend / income) * 100 : 0;

    const kpis =
      '<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">' +
        kpiCard('Income · ' + shortMonthLabel(key), money(income, 0), 'Earned this month', 'emerald', 'arrowUp') +
        kpiCard('Expenses', money(expenses, 0), 'Spent this month', 'rose', 'arrowDown') +
        kpiCard('Net Cash Flow', '<span class="' + (net >= 0 ? 'text-emerald-500' : 'text-rose-500') + '">' + money(net, 0) + '</span>', net >= 0 ? 'Surplus' : 'Deficit', 'brand', 'wallet') +
        kpiCard('Savings Rate', pct(savingsRate, 1), 'Saved / income', 'sky', 'target') +
      '</div>';

    const recent = state.transactions.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 6);
    const recentHtml = recent.length
      ? '<ul class="divide-y divide-slate-100 dark:divide-slate-800">' + recent.map((t) => {
          const c = catOf(t.categoryId);
          const isInc = t.type === 'income';
          return '<li class="flex items-center gap-3 py-3">' +
            '<span class="grid place-items-center w-9 h-9 rounded-lg text-base shrink-0" style="background:' + (c ? c.color : '#64748b') + '22">' + (c && c.icon ? c.icon : '💳') + '</span>' +
            '<div class="min-w-0 flex-1">' +
              '<p class="text-sm font-semibold truncate">' + esc(t.description || catName(t.categoryId)) + '</p>' +
              '<p class="text-xs text-slate-400">' + esc(catName(t.categoryId)) + ' · ' + fmtDate(t.date) + '</p>' +
            '</div>' +
            '<span class="text-sm font-bold ' + (isInc ? 'text-emerald-500' : 'text-rose-500') + '">' + (isInc ? '+' : '−') + money(t.amount, 2) + '</span>' +
          '</li>';
        }).join('') + '</ul>'
      : emptyState('No transactions yet', 'Log an income or expense to see it here.', '<button data-action="add-tx" data-type="expense" class="btn-primary">Add transaction</button>');

    const monthOptions = (() => {
      const set = new Set(state.transactions.map((t) => ym(t.date)));
      set.add(currentYM());
      return Array.from(set).sort().reverse().map((m) =>

    return '' +

          '<p class="text-sm text-slate-400 mt-0.5">Your money at a glance.</p>' +
        '</div>' +
        '<div class="flex items-center gap-2 flex-wrap">' +
          '<input type="month" id="dash-month" class="input py-2 w-auto" value="' + key + '" />' +
          '<button data-action="goto" data-tab="goals" class="btn-soft">' + icon('goals', 'w-4 h-4') + '<span class="hidden sm:inline">Goals</span></button>' +
          '<button data-action="add-tx" data-type="income" class="btn-soft">' + icon('arrowUp', 'w-4 h-4') + '<span class="hidden sm:inline">Income</span></button>' +
          '<button data-action="add-tx" data-type="expense" class="btn-primary">' + icon('plus', 'w-4 h-4') + '<span class="hidden sm:inline">Expense</span></button>' +
        '</div>' +

      kpis +

        '<div class="card card-pad lg:col-span-3">' +
          '<div class="flex items-center justify-between mb-4">' +
            '<h2 class="font-bold">Income vs Expenses</h2>' +

  function destroyCharts() {
    if (ui.charts.expense) { ui.charts.expense.destroy(); ui.charts.expense = null; }
    if (ui.charts.trend) { ui.charts.trend.destroy(); ui.charts.trend = null; }
  }

  function renderCharts() {
    if (!window.Chart) return;
    updateChartTheme();
    const key = ui.dashboardMonth || currentYM();

    // Doughnut
    const tx = monthTx(key).filter((t) => t.type === 'expense');
    const byCat = {};
    tx.forEach((t) => { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + num(t.amount); });
    const entries = Object.entries(byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
    const doughCanvas = document.getElementById('chart-expense');
    if (doughCanvas) {
      if (!entries.length) {
        doughCanvas.parentElement.innerHTML = emptyState('No expenses', 'No spending recorded for ' + monthLabel(key) + '.');
      } else {
        ui.charts.expense = new Chart(doughCanvas, {
          type: 'doughnut',
          data: {
            labels: entries.map(([id]) => catName(id)),
            datasets: [{
              data: entries.map(([, v]) => round2(v)),
              backgroundColor: entries.map(([id]) => catColor(id)),
              borderWidth: 0,
              hoverOffset: 6,
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '62%',
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle', padding: 14, font: { size: 11 } } },
              tooltip: { callbacks: { label: (c) => ' ' + c.label + ': ' + money(c.raw, 2) } },
            },
          },
        });
      }
    }

    // Trend bar
    const months = last6Months();
    const trendCanvas = document.getElementById('chart-trend');
    if (trendCanvas) {
      const inc = months.map((m) => round2(sumMonth(m, 'income')));
      const exp = months.map((m) => round2(sumMonth(m, 'expense')));
      ui.charts.trend = new Chart(trendCanvas, {
        type: 'bar',
        data: {
          labels: months.map(shortMonthLabel),
          datasets: [
            { label: 'Income', data: inc, backgroundColor: '#10b981', borderRadius: 6, maxBarThickness: 26 },
            { label: 'Expenses', data: exp, backgroundColor: '#f43f5e', borderRadius: 6, maxBarThickness: 26 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'circle', padding: 14, font: { size: 11 } } },
            tooltip: { callbacks: { label: (c) => ' ' + c.dataset.label + ': ' + money(c.raw, 0) } },
          },
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, grid: { drawBorder: false }, ticks: { callback: (v) => compactMoney(v) } },
          },
        },
      });
    }
  }

  function viewBudget() {
    const key = currentYM();
    const rule = state.budgetRule;
    const monthIncome = sumMonth(key, 'income');
    const baseline = num(rule.baselineIncome) > 0 ? num(rule.baselineIncome) : monthIncome;
    const active = rule.mode === '50/30/20' ? { needs: 50, wants: 30, savings: 20 } : { needs: num(rule.needs), wants: num(rule.wants), savings: num(rule.savings) };
    const totalPct = active.needs + active.wants + active.savings;

    const groupSpend = { needs: 0, wants: 0, savings: 0 };
    monthTx(key).filter((t) => t.type === 'expense').forEach((t) => {
      const c = catOf(t.categoryId);
      if (c && groupSpend[c.group] !== undefined) groupSpend[c.group] += num(t.amount);
    });

    const ruleCard =
      '<div class="card card-pad mb-4">' +
        '<div class="flex flex-wrap items-center justify-between gap-3 mb-5">' +
          '<div>' +
            '<h2 class="font-bold text-lg">Allocation Rule</h2>' +
            '<p class="text-sm text-slate-400">Baseline: <span class="font-semibold text-slate-600 dark:text-slate-300">' + money(baseline, 0) + '</span>' + (num(rule.baselineIncome) > 0 ? ' (set)' : ' (from income)') + '</p>' +
          '</div>' +
          '<div class="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1">' +
            '<button data-action="rule-mode" data-mode="50/30/20" class="px-3.5 py-1.5 text-xs font-bold rounded-lg ' + (rule.mode === '50/30/20' ? 'bg-white dark:bg-slate-900 shadow-sm' : 'text-slate-500') + '">50 / 30 / 20</button>' +
            '<button data-action="rule-mode" data-mode="custom" class="px-3.5 py-1.5 text-xs font-bold rounded-lg ' + (rule.mode === 'custom' ? 'bg-white dark:bg-slate-900 shadow-sm' : 'text-slate-500') + '">Custom</button>' +
          '</div>' +
        '</div>' +

              '<div><label class="label">Needs %</label><input type="number" min="0" max="100" data-rule="needs" class="input" value="' + num(rule.needs) + '" /></div>' +
              '<div><label class="label">Wants %</label><input type="number" min="0" max="100" data-rule="wants" class="input" value="' + num(rule.wants) + '" /></div>' +
              '<div><label class="label">Savings %</label><input type="number" min="0" max="100" data-rule="savings" class="input" value="' + num(rule.savings) + '" /></div>' +
            '</div>' +

            const spent = groupSpend[g];

              '</div>' +

            '</div>';
          }).join('') +

      '</div>';

    const cats = state.categories.filter((c) => c.type === 'expense');

    const catRows = cats.length

            '<div class="min-w-0 flex-1">' +

  /* ------------------------------------------------------------------ *
   * 10. VIEW: TRANSACTIONS
   * ------------------------------------------------------------------ */
  function txFilters() {
    return {
      search: (document.getElementById('tx-search') || {}).value || '',
      type: (document.getElementById('tx-type') || {}).value || 'all',
      category: (document.getElementById('tx-cat') || {}).value || 'all',
      from: (document.getElementById('tx-from') || {}).value || '',
      to: (document.getElementById('tx-to') || {}).value || '',
      sort: (document.getElementById('tx-sort') || {}).value || 'date-desc',
    };
  }

  function filteredTx() {
    const f = txFilters();
    let list = state.transactions.slice();
    if (f.search) {
      const q = f.search.toLowerCase();
      list = list.filter((t) => (t.description || '').toLowerCase().includes(q) || catName(t.categoryId).toLowerCase().includes(q));
    }
    if (f.type !== 'all') list = list.filter((t) => t.type === f.type);
    if (f.category !== 'all') list = list.filter((t) => t.categoryId === f.category);
    if (f.from) list = list.filter((t) => t.date >= f.from + '-01');
    if (f.to) {
      const [y, m] = f.to.split('-').map(Number);
      const last = new Date(y, m, 0).getDate();
      list = list.filter((t) => t.date <= f.to + '-' + pad2(last));
    }
    const [field, dir] = f.sort.split('-');
    list.sort((a, b) => {
      let r;
      if (field === 'amount') r = num(a.amount) - num(b.amount);
      else r = (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      return dir === 'desc' ? -r : r;
    });
    return list;
  }

  function renderTxTable() {

    if (!container) return;
    const list = filteredTx();

    const rows = slice.map((t) => {

        '<td class="table-td max-w-[240px]"><span class="truncate block text-slate-500 dark:text-slate-400">' + esc(t.description || '—') + '</span></td>' +
        '<td class="table-td">' + rec + '</td>' +

        '<td class="table-td text-right whitespace-nowrap">' +
          '<button class="btn-icon" data-action="edit-tx" data-id="' + t.id + '" title="Edit">' + icon('edit', 'w-4 h-4') + '</button>' +
          '<button class="btn-icon hover:text-rose-500" data-action="delete-tx" data-id="' + t.id + '" title="Delete">' + icon('trash', 'w-4 h-4') + '</button>' +

            '<span class="px-3 py-1.5 text-xs font-semibold">' + ui.txPage + ' / ' + pages + '</span>' +

          '</div>' +

      : '';

    container.innerHTML =
      '<div class="overflow-x-auto"><table class="w-full min-w-[680px]">' +
        '<thead><tr class="bg-slate-50 dark:bg-slate-900/60">' +
          '<th class="table-th">Date</th><th class="table-th">Category</th><th class="table-th">Description</th>' +
          '<th class="table-th">Recurring</th><th class="table-th text-right">Amount</th><th class="table-th"></th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' + pag;

  /* ------------------------------------------------------------------ *
   * 11. VIEW: GOALS
   * ------------------------------------------------------------------ */
  function goalStats(g) {
    const target = num(g.targetAmount);
    const current = num(g.currentAmount);
    const remaining = Math.max(0, target - current);
    const p = target ? (current / target) * 100 : 0;

    const deposits = (g.contributions || []).filter((c) => c.type === 'deposit');
    let avgMonthly = 0;
    if (deposits.length) {
      const cutoff = addMonths(new Date(), -3);
      const recent = deposits.filter((c) => new Date(c.date + 'T00:00:00') >= cutoff);
      const basis = recent.length ? recent : deposits;
      avgMonthly = sum(basis, (c) => num(c.amount)) / (recent.length ? 3 : Math.max(1, monthsBetween(new Date(basis[0].date + 'T00:00:00'), new Date())));
    }

    let requiredMonthly = null;
    if (g.targetDate) {
      const monthsLeft = Math.max(1, monthsBetween(new Date(), new Date(g.targetDate + 'T00:00:00')));
      requiredMonthly = remaining / monthsLeft;
    }
    let eta = null;
    if (avgMonthly > 0 && remaining > 0) eta = addMonths(new Date(), Math.ceil(remaining / avgMonthly));
    else if (remaining <= 0) eta = new Date();
    return { target, current, remaining, p, avgMonthly, requiredMonthly, eta };
  }
  function monthsBetween(a, b) {
    return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  }

  function viewGoals() {
    const goals = state.goals;

              '<p class="font-bold truncate">' + esc(g.name) + '</p>' +

            '</div>' +
          '</div>' +
          (done ? '<span class="badge bg-emerald-500/15 text-emerald-500 shrink-0">✓ Complete</span>' : '') +
        '</div>' +
        '<div class="mt-4">' +
          '<div class="flex items-end justify-between mb-1.5">' +
            '<span class="text-2xl font-extrabold">' + money(s.current, 0) + '</span>' +
            '<span class="text-sm font-semibold" style="color:' + col + '">' + pct(s.p, 0) + '</span>' +
          '</div>' +
          '<div class="progress"><div class="progress-bar" style="width:' + clamp(s.p, 0, 100) + '%;background:' + col + '"></div></div>' +
          '<div class="flex items-center justify-between mt-1.5 text-[11px] text-slate-400">' +
            '<span>of ' + money(s.target, 0) + '</span>' +
            '<span>' + money(s.remaining, 0) + ' to go</span>' +
          '</div>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-2 mt-4 text-center">' +
          '<div class="rounded-xl bg-slate-50 dark:bg-slate-800/60 px-2 py-2">' +
            '<p class="text-[10px] uppercase tracking-wide text-slate-400 font-bold">Monthly need</p>' +
            '<p class="text-sm font-bold mt-0.5">' + (s.requiredMonthly !== null ? money(s.requiredMonthly, 0) : '—') + '</p>' +
          '</div>' +
          '<div class="rounded-xl bg-slate-50 dark:bg-slate-800/60 px-2 py-2">' +
            '<p class="text-[10px] uppercase tracking-wide text-slate-400 font-bold">Est. done</p>' +
            '<p class="text-sm font-bold mt-0.5">' + (s.eta ? (s.eta.getFullYear() === new Date().getFullYear() && s.p >= 100 ? 'Now' : new Date(s.eta).toLocaleDateString(locale(), { month: 'short', year: 'numeric' })) : '—') + '</p>' +
          '</div>' +

        (g.notes ? '<p class="text-xs text-slate-400 mt-3 line-clamp-2">' + esc(g.notes) + '</p>' : '') +
        '<div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-slate-100 dark:border-slate-800">' +
          '<button data-action="goal-deposit" data-id="' + g.id + '" class="btn-primary btn-xs flex-1">' + icon('plus', 'w-3.5 h-3.5') + 'Deposit</button>' +
          '<button data-action="goal-withdraw" data-id="' + g.id + '" class="btn-soft btn-xs flex-1">Withdraw</button>' +
          '<button data-action="goal-quick" data-id="' + g.id + '" class="btn-soft btn-xs" title="Allocate this month\'s net savings">' + icon('target', 'w-3.5 h-3.5') + '</button>' +

          '<button class="btn-icon hover:text-rose-500" data-action="delete-goal" data-id="' + g.id + '" title="Delete">' + icon('trash', 'w-4 h-4') + '</button>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

    return header + cards;
  }

  function currentNetSavings() {
    const key = currentYM();
    return sumMonth(key, 'income') - sumMonth(key, 'expense');
  }

  function goalContribution(g, amount, type, dateStr) {
    amount = round2(Math.abs(num(amount)));
    if (!amount) return false;
    g.contributions = g.contributions || [];
    g.contributions.push({ id: uid(), date: dateStr || todayISO(), amount, type });
    g.currentAmount = round2(num(g.currentAmount) + (type === 'deposit' ? amount : -amount));
    if (g.currentAmount < 0) g.currentAmount = 0;
    // reflect in transactions under a savings category
    const cat = state.categories.find((c) => c.group === 'savings') || null;
    if (cat) {
      state.transactions.push({
        id: uid(), date: dateStr || todayISO(), categoryId: cat.id,
        type: 'expense', amount, description: (type === 'deposit' ? 'Goal deposit · ' : 'Goal withdrawal · ') + g.name,
        recurring: 'none',
      });
    }
    save();
    return true;
  }

          '</div>' +

          '<div><label class="label">Description</label><input name="description" class="input" value="' + (isEdit ? esc(existing.description) : '') + '" placeholder="Optional note" /></div>' +
          '<div><label class="label">Recurring</label><select name="recurring" class="select">' +
            '<option value="none"' + (isEdit && existing.recurring === 'none' ? ' selected' : '') + '>One-off</option>' +
            '<option value="monthly"' + (isEdit && existing.recurring === 'monthly' ? ' selected' : '') + '>Monthly</option>' +

          '</select></div>' +
        '</div>',
      submitLabel: isEdit ? 'Save changes' : 'Add transaction',
      onSubmit: (data) => {
        if (!num(data.amount)) { toast('Enter an amount greater than zero', 'error'); return false; }

        if (isEdit) updateTransaction(existing.id, data);

        render();

    });

        '<div class="space-y-4">' +
          '<p class="text-sm text-slate-600 dark:text-slate-300">This permanently deletes all categories, transactions, goals and salary settings from this browser. This cannot be undone.</p>' +
          '<div><label class="label">Type <span class="text-rose-500">RESET</span> to confirm</label><input name="confirm" class="input" placeholder="RESET" autocomplete="off" /></div>' +
        '</div>',
      submitLabel: 'Delete everything',
      onSubmit: (data) => {
        if ((data.confirm || '').trim().toUpperCase() !== 'RESET') { toast('Type RESET to confirm', 'error'); return false; }
        state = freshState();
        save();
        toast('All data reset', 'success');
        route();
        renderSidebar();
      },
    });
  }

  /* ------------------------------------------------------------------ *
   * 14. DATA PORTABILITY
   * ------------------------------------------------------------------ */
  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function stamp() { const d = new Date(); return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes()); }

  function exportJSON() {
    download('stash-stack-' + stamp() + '.json', JSON.stringify(state, null, 2), 'application/json');
    toast('Exported JSON backup', 'success');
  }

  function csvCell(v) {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCSV() {
    const headers = ['Date', 'Type', 'Category', 'Amount', 'Description', 'Recurring'];
    const rows = state.transactions.slice()
      .sort((a, b) => (a.date < b.date ? -1 : 1))
      .map((t) => [t.date, t.type, catName(t.categoryId), num(t.amount), t.description || '', t.recurring || 'none']);
    const csv = [headers].concat(rows).map((r) => r.map(csvCell).join(',')).join('\n');
    download('stash-stack-transactions-' + stamp() + '.csv', csv, 'text/csv');
    toast('Exported transactions CSV', 'success');
  }

  function importJSONFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object' || !('transactions' in parsed || 'categories' in parsed)) {
          throw new Error('Not a Stash-Stack backup');
        }
        confirmModal('Importing will replace your current data with the contents of "' + file.name + '". Continue?', () => {
          state = mergeState(parsed);
          save();
          materializeRecurring();
          renderSidebar();
          route();
          toast('Data imported', 'success');
        }, { title: 'Import data', submitLabel: 'Replace data' });
      } catch (err) {
        toast('Import failed: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  }

  function buildSample() {
    const now = new Date();
    const cats = DEFAULT_CATEGORIES.map((c) => ({ id: uid(), ...c }));
    const by = (name) => (cats.find((c) => c.name === name) || {}).id;
    const tx = [];
    const put = (mOffset, day, name, type, amount, desc, rec) => {
      const d = new Date(now.getFullYear(), now.getMonth() + mOffset, day);
      tx.push({ id: uid(), date: isoDate(d), categoryId: by(name), type, amount: round2(amount), description: desc, recurring: rec || 'none' });
    };
    for (let m = -3; m <= 0; m++) {
      put(m, 1, 'Salary', 'income', 42000, 'Monthly salary');
      put(m, 2, 'Rent / Bond', 'expense', 9500, 'Rent');
      put(m, 6, 'Groceries', 'expense', 3400 + (m + 3) * 120, 'Weekly groceries');
      put(m, 8, 'Transport', 'expense', 2100, 'Fuel & transport');
      put(m, 10, 'Utilities', 'expense', 1650, 'Electricity & water');
      put(m, 12, 'Insurance', 'expense', 1450, 'Car & medical');
      put(m, 14, 'Dining Out', 'expense', 1200 + (m + 3) * 80, 'Restaurants');
      put(m, 18, 'Entertainment', 'expense', 850, 'Movies & games');
      put(m, 20, 'Shopping', 'expense', 900 + (m + 3) * 100, 'Clothing');
      put(m, 22, 'Emergency Fund', 'expense', 2500, 'Savings transfer');
      put(m, 25, 'Investments', 'expense', 4000, 'ETF contribution');
      if (m === 0) put(m, Math.min(now.getDate(), 26), 'Freelance', 'income', 6500, 'Side project');
    }
    // one live recurring template for future months
    put(0, Math.min(now.getDate(), 15), 'Subscriptions', 'expense', 599, 'Streaming services', 'monthly');

    const gd = (offsetMonths) => isoDate(new Date(now.getFullYear(), now.getMonth() + offsetMonths, 1));
    const goals = [
      {
        id: uid(), name: 'Emergency Fund', targetAmount: 100000, currentAmount: 24000,
        targetDate: gd(18), icon: '🆘', color: '#22c55e', notes: '3–6 months of essential expenses.',
        contributions: [
          { id: uid(), date: isoDate(addMonths(now, -3)), amount: 2500, type: 'deposit' },
          { id: uid(), date: isoDate(addMonths(now, -2)), amount: 2500, type: 'deposit' },
          { id: uid(), date: isoDate(addMonths(now, -1)), amount: 2500, type: 'deposit' },
        ],
      },
      {
        id: uid(), name: 'House Deposit', targetAmount: 500000, currentAmount: 75000,
        targetDate: gd(48), icon: '🏠', color: '#6366f1', notes: '20% deposit target.',
        contributions: [
          { id: uid(), date: isoDate(addMonths(now, -3)), amount: 5000, type: 'deposit' },
          { id: uid(), date: isoDate(addMonths(now, -1)), amount: 7000, type: 'deposit' },
        ],
      },
      {
        id: uid(), name: 'Vacation · Bali', targetAmount: 40000, currentAmount: 12000,
        targetDate: gd(10), icon: '🏝️', color: '#0ea5e9', notes: 'Flights + accommodation.',
        contributions: [
          { id: uid(), date: isoDate(addMonths(now, -2)), amount: 4000, type: 'deposit' },
          { id: uid(), date: isoDate(addMonths(now, -1)), amount: 3000, type: 'deposit' },
        ],
      },
    ];

    return {
      version: 1,
      settings: { theme: state.settings.theme, currency: state.settings.currency, locale: state.settings.locale, salary: defaultSalary((CURRENCY_PROFILES[state.settings.currency] || {}).country || 'ZA') },
      categories: cats,
      transactions: tx,
      goals,
      budgetRule: { mode: '50/30/20', needs: 50, wants: 30, savings: 20, baselineIncome: 42000 },
    };
  }

  function loadSample() {
    confirmModal('Load sample data? This replaces your current data with a realistic demo dataset.', () => {
      state = buildSample();
      save();
      renderSidebar();
      route();
      toast('Sample data loaded', 'success');
    }, { title: 'Load sample data', submitLabel: 'Load sample' });
  }

  /* ------------------------------------------------------------------ *
   * 15. EVENT WIRING
   * ------------------------------------------------------------------ */
  function currentUserId() { return null; }

  function handleAction(action, el) {
    const id = el.dataset.id;
    switch (action) {
      case 'add-tx': txModal(null, el.dataset.type); break;
      case 'edit-tx': { const t = state.transactions.find((x) => x.id === id); if (t) txModal(t); break; }
      case 'delete-tx':
        confirmModal('Delete this transaction?', () => { deleteTransaction(id); toast('Transaction deleted', 'success'); render(); }, { title: 'Delete transaction', submitLabel: 'Delete' });
        break;
      case 'add-category': categoryModal(null); break;
      case 'edit-category': { const c = catOf(id); if (c) categoryModal(c); break; }
      case 'delete-category':
        confirmModal('Delete this category? Transactions using it will show as uncategorised.', () => { state.categories = state.categories.filter((c) => c.id !== id); save(); toast('Category deleted', 'success'); render(); }, { title: 'Delete category', submitLabel: 'Delete' });
        break;
      case 'add-goal': goalModal(null); break;
      case 'edit-goal': { const g = state.goals.find((x) => x.id === id); if (g) goalModal(g); break; }
      case 'delete-goal':
        confirmModal('Delete this goal? Its contribution history will be removed (transactions remain).', () => { state.goals = state.goals.filter((g) => g.id !== id); save(); toast('Goal deleted', 'success'); render(); }, { title: 'Delete goal', submitLabel: 'Delete' });
        break;
      case 'goal-deposit': { const g = state.goals.find((x) => x.id === id); if (g) goalFundsModal(g, 'deposit'); break; }
      case 'goal-withdraw': { const g = state.goals.find((x) => x.id === id); if (g) goalFundsModal(g, 'withdraw'); break; }
      case 'goal-quick': {
        const g = state.goals.find((x) => x.id === id);
        if (!g) break;
        const net = currentNetSavings();
        if (net <= 0) { toast('No positive net savings this month to allocate', 'error'); break; }
        const s = goalStats(g);
        const amt = Math.min(net, s.remaining > 0 ? s.remaining : net);
        confirmModal('Allocate ' + money(amt, 2) + ' of this month\'s net savings into "' + g.name + '"?', () => {
          goalContribution(g, amt, 'deposit');
          toast('Allocated ' + money(amt, 0) + ' to ' + g.name, 'success');
          render();
        }, { title: 'Quick allocate', submitLabel: 'Allocate' });
        break;
      }
      case 'rule-mode':
        state.budgetRule.mode = el.dataset.mode;
        save(); render();
        break;
      case 'add-band': state.settings.salary.bands.push({ upTo: null, rate: 0 }); save(); render(); break;
      case 'del-band': state.settings.salary.bands.splice(+el.dataset.index, 1); save(); render(); break;
      case 'add-contrib': state.settings.salary.contributions.push({ name: 'New contribution', rate: 0, threshold: 0, thresholdPeriod: 'year', cap: null, capPeriod: 'year', deductible: false }); save(); render(); break;
      case 'del-contrib': state.settings.salary.contributions.splice(+el.dataset.index, 1); save(); render(); break;
      case 'add-ded': state.settings.salary.deductions.push({ name: 'New deduction', amount: 0, type: 'fixed', period: 'month', pretax: false }); save(); render(); break;
      case 'del-ded': state.settings.salary.deductions.splice(+el.dataset.index, 1); save(); render(); break;
      case 'set-baseline': {
        const r = computeSalary();
        state.budgetRule.baselineIncome = round2(r.net);
        save();
        toast('Monthly budget baseline set to ' + money(r.net, 0), 'success');
        break;
      }
      case 'goto': go(el.dataset.tab); break;
      case 'tx-page': ui.txPage = +el.dataset.page; renderTxTable(); break;
      case 'export-json': exportJSON(); break;
      case 'export-csv': exportCSV(); break;
      case 'import-json': document.getElementById('import-file').click(); break;
      case 'sample': loadSample(); break;
      case 'reset': resetModal(); break;
      default: break;
    }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (el) { handleAction(el.dataset.action, el); return; }
    // mobile menu
    if (e.target.closest('#menu-toggle')) openSidebar();
    else if (e.target.closest('#menu-close') || e.target.closest('#sidebar-overlay')) closeSidebar();
    else if (e.target.closest('#theme-toggle') || e.target.closest('#theme-toggle-mobile')) toggleTheme();
  });

  document.getElementById('currency-select').addEventListener('change', (e) => {
    applyCurrency(e.target.value);
    renderSidebar();
    render();
    toast('Currency set to ' + e.target.value, 'info');
  });

  document.getElementById('import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importJSONFile(file);
    e.target.value = '';
  });

  // Live search (table only) + dashboard month
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'tx-search') { ui.txPage = 1; renderTxTable(); return; }
    if (t.id === 'tx-from' || t.id === 'tx-to') { ui.txPage = 1; renderTxTable(); return; }
    if (t.dataset.rule) { state.budgetRule[t.dataset.rule] = num(t.value); save(); if (activeTab() === 'budget' && t.value !== '') { /* live but avoid rerender loop */ } return; }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;

    if (t.id === 'dash-month') { ui.dashboardMonth = t.value || currentYM(); destroyCharts(); render(); return; }
    if (t.id === 'tx-type' || t.id === 'tx-cat' || t.id === 'tx-sort') { ui.txPage = 1; renderTxTable(); return; }
    if (t.id === 'cat-type') {
      const groupSel = document.getElementById('cat-group');
      if (t.value === 'income') groupSel.value = 'income';
      else if (groupSel.value === 'income') groupSel.value = 'needs';
      return;
    }
    if (t.id === 'sal-gross' || t.dataset.salary === 'gross') {
      state.settings.salary.gross = num(t.value); save(); updateSalaryResults(); return;
    }
    if (t.dataset.salary === 'period') { state.settings.salary.period = t.value; save(); render(); return; }
    if (t.dataset.salary === 'preset') {
      if (t.value === 'custom') { state.settings.salary.presetKey = 'custom'; }
      else applyPreset(t.value);
      save(); render(); return;
    }
    if (t.dataset.salary) { state.settings.salary[t.dataset.salary] = num(t.value); save(); updateSalaryResults(); return; }

    if (t.dataset.band !== undefined && t.dataset.band !== '') {
      const b = state.settings.salary.bands[+t.dataset.band];
      if (b) { b[t.dataset.field] = t.dataset.field === 'upTo' ? (t.value === '' ? null : num(t.value)) : num(t.value); save(); updateSalaryResults(); }
      return;
    }
    if (t.dataset.contrib !== undefined && t.dataset.contrib !== '') {
      const c = state.settings.salary.contributions[+t.dataset.contrib];
      if (c) {
        const f = t.dataset.field;
        if (f === 'deductible') c.deductible = t.checked;
        else if (f === 'name') c.name = t.value;
        else if (f === 'cap') c.cap = t.value === '' ? null : num(t.value);
        else if (f === 'rate') c.rate = num(t.value);
        else c[f] = t.value;
        save(); updateSalaryResults();
      }
      return;
    }
    if (t.dataset.ded !== undefined && t.dataset.ded !== '') {
      const d = state.settings.salary.deductions[+t.dataset.ded];
      if (d) {
        const f = t.dataset.field;
        if (f === 'pretax') d.pretax = t.checked;
        else if (f === 'name') d.name = t.value;
        else if (f === 'amount') d.amount = num(t.value);
        else d[f] = t.value;
        save(); updateSalaryResults();
      }
      return;
    }
    if (t.dataset.rule) {
      state.budgetRule[t.dataset.rule] = num(t.value);
      save(); render();
      return;
    }
    if (t.dataset.target) {
      const c = catOf(t.dataset.target);
      if (c) { c.target = round2(num(t.value)); save(); render(); }
      return;
    }
  });

  /* ------------------------------------------------------------------ *
   * 16. INIT
   * ------------------------------------------------------------------ */
  function init() {
    if (!localStorage.getItem(STORAGE_KEY)) {
      localStorage.setItem(STORAGE_KEY, '');
    }
    state = loadState();
    materializeRecurring();
    document.documentElement.classList.toggle('dark', state.settings.theme === 'dark');
    if (!ui.dashboardMonth) ui.dashboardMonth = currentYM();
    renderSidebar();
    window.addEventListener('hashchange', route);
    if (!location.hash) location.hash = '#dashboard';
    route();
    setTimeout(() => {
      if (!state.transactions.length && !state.goals.length) {
        toast('Tip: load sample data from the sidebar to explore.', 'info');
      }
    }, 900);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
